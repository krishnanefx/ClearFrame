# News Source Configuration
# Tags: region, state_aligned, independent, diaspora, language

sources:
  # RSS Feeds
  - type: rss
    url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"
    name: "New York Times - World"
    tags:
      region: "global"
      state_aligned: false
      independent: true
      diaspora: false
      language: "en"
    refresh_interval: 1800  # 30 minutes
    
  - type: rss
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    name: "BBC World News"
    tags:
      region: "global"
      state_aligned: false
      independent: true
      diaspora: false
      language: "en"
    refresh_interval: 1800

  # Direct URLs
  - type: url
    url: "https://www.aljazeera.com/news/"
    name: "Al Jazeera"
    tags:
      region: "middle_east"
      state_aligned: false
      independent: true
      diaspora: false
      language: "en"
    refresh_interval: 3600
    
  # API Sources
  - type: api
    url: "https://newsapi.org/v2/top-headlines"
    name: "NewsAPI - Top Headlines"
    auth_type: "api_key"
    auth_key: "${NEWS_API_KEY}"
    params:
      country: "us"
      category: "general"
    tags:
      region: "north_america"
      state_aligned: false
      independent: true
      diaspora: false
      language: "en"
    refresh_interval: 3600
    
  # Diaspora Blogs
  - type: url
    url: "https://example-diaspora-blog.com"
    name: "Example Diaspora Blog"
    tags:
      region: "global"
      state_aligned: false
      independent: true
      diaspora: true
      language: "en"
    refresh_interval: 7200
    
  # State-aligned sources
  - type: rss
    url: "https://example-state-media.com/rss"
    name: "Example State Media"
    tags:
      region: "asia"
      state_aligned: true
      independent: false
      diaspora: false
      language: "en"
    refresh_interval: 3600

# Source lists from external files
source_lists:
  - type: github
    url: "https://raw.githubusercontent.com/example/diaspora-sources/main/blogs.json"
    format: "json"
    tags:
      diaspora: true
      
  - type: github
    url: "https://raw.githubusercontent.com/example/independent-media/main/sources.yaml"
    format: "yaml"
    tags:
      independent: true
